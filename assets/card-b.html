<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1200px;height:630px;overflow:hidden}
  body{background:#141414;font-family:'Libre Franklin',Arial,sans-serif}
  .wrap{width:1200px;height:630px;display:flex;flex-direction:column;padding:64px 72px}
  .top{display:flex;align-items:center;gap:18px}
  .top img{width:64px;height:64px}
  .w{color:#F2EDE1;font-weight:900;font-size:44px;letter-spacing:1px;text-transform:uppercase}
  .m{color:#C9C1AE;font-size:13px;letter-spacing:3px;line-height:1.5}
  .rule{height:3px;background:#620E14;margin:34px 0 30px}
  .bands{flex:1;display:flex;flex-direction:column;justify-content:center;gap:14px}
  .band span{color:#F2EDE1;font-weight:900;font-size:52px;letter-spacing:.5px;text-transform:uppercase}
  .bot{display:flex;justify-content:space-between;align-items:flex-end}
  .bot .t{color:#C9C1AE;font-size:17px;line-height:1.6}
  .bot .u{color:#F2EDE1;font-size:16px;letter-spacing:1px}
</style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <img src="/assets/logo-black.png" alt="">
      <div class="w">Garbatrage</div>
      <div class="m">Satire<br>Est. 2026</div>
    </div>
    <div class="rule"></div>
    <div class="bands">
      <div class="band"><span>Markets.</span></div>
      <div class="band"><span>Money.</span></div>
      <div class="band"><span>Mischief.</span></div>
    </div>
    <div class="bot">
      <div class="t">Satirical financial news<br>Not investment advice</div>
      <div class="u">garbatrage.com</div>
    </div>
  </div>
</body>
</html>
